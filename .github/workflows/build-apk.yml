name: Build TenMeds Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f ten_meds_kotlin/gradlew ]; then
            chmod +x ten_meds_kotlin/gradlew
          fi

      - name: Build with Gradle
        run: |
          cd ten_meds_kotlin
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenMeds-Debug-APK
          path: ten_meds_kotlin/app/build/outputs/apk/debug/*.apk
          retention-days: 14