name: Build Ten Meds Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Determine Flutter Project Directory
        id: locate_project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "ten_meds_mobile/pubspec.yaml" ]; then
            echo "dir=ten_meds_mobile" >> $GITHUB_OUTPUT
          else
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.locate_project.outputs.dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.locate_project.outputs.dir }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TenMeds.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenMeds-APK
          path: ${{ steps.locate_project.outputs.dir }}/build/app/outputs/flutter-apk/TenMeds.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Ten Meds v1.0.0 - Emergency Delivery App"
          body: |
            ### 💊 Ten Meds Android APK
            Download the raw `TenMeds.apk` directly below to install on your Android phone without needing to unzip.
            
            - **Minimum Android Version:** Android 5.0 (API 21+)
            - **Package Name:** `com.tenmeds.ten_meds_mobile`
          files: ${{ steps.locate_project.outputs.dir }}/build/app/outputs/flutter-apk/TenMeds.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
